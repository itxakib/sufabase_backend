[project]
name = "sufabase"
version = "0.1.0"
description = "backend django"
authors = [
    {name = "123344556677",email = "hananabdul659@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "django-filter (>=26.1,<27.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "drf-spectacular (>=0.28,<1.0)",
    "django-cors-headers (>=4.9,<5.0)",
    # Required by Customer.avatar (ImageField validates that the uploaded bytes
    # really are an image; without Pillow, ImageField raises at import time).
    "pillow (>=11,<13)",
    # Required by the directory app to parse legacy .xls workbook exports.
    # NOTE: xlrd 2.x dropped .xlsx support — if a future export is .xlsx,
    # add openpyxl and branch in services.py._iter_source_rows.
    "xlrd (>=1.2,<3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
